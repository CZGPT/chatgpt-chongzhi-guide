<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <style>
    body {
      max-width: 780px;
      margin: 0 auto;
      padding: 24px 16px 64px;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      line-height: 1.75;
      color: #24292f;
    }
    h1 { font-size: 1.7em; line-height: 1.35; }
    h2 { font-size: 1.35em; margin-top: 2em; border-bottom: 1px solid #eaecef; padding-bottom: .3em; }
    h3 { font-size: 1.1em; margin-top: 1.6em; }
    table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; margin: 1em 0; }
    th, td { border: 1px solid #d0d7de; padding: 8px 12px; text-align: left; font-size: .95em; }
    th { background: #f6f8fa; }
    code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; font-size: .9em; }
    blockquote { border-left: 4px solid #d0d7de; margin: 1em 0; padding: 0 1em; color: #57606a; }
    a { color: #0969da; text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav.crumb { font-size: .9em; margin-bottom: 24px; color: #57606a; }
    footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid #eaecef; font-size: .85em; color: #57606a; }
  </style>
</head>
<body>
  <nav class="crumb"><a href="{{ '/' | relative_url }}">← ChatGPT充值指南 2026</a></nav>
  <main>
    {{ content }}
  </main>
  <footer>
    本站内容为技术信息整理，持续更新于 GitHub 仓库，欢迎提 Issue / PR 指正。最后构建：{{ site.time | date: "%Y-%m-%d" }}
  </footer>
</body>
</html>
